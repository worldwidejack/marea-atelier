<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier di MAREA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #1b1712; --carta: #2a231b; --carta2: #342b21; --riga: #45392b;
    --testo: #f4e3c1; --piano: #c9b394; --tenue: #8f7d66;
    --mare: #3fb9c9; --mare-chiaro: #7fe3e0; --lanterna: #e8433f; --arancio: #f2a33a; --giallo: #f5d547; --erba: #8fc35b;
  }
  * { box-sizing: border-box; }
  html { background: var(--fondo); }
  body { margin: 0; background: var(--fondo); color: var(--testo); font: 400 15px/1.55 Inter, system-ui, sans-serif; }
  a { color: var(--mare-chiaro); }
  .pagina { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
  h1, h2, h3 { font-family: 'Bricolage Grotesque', Inter, sans-serif; margin: 0; letter-spacing: -0.01em; }

  /* testata */
  .testata { background: repeating-linear-gradient(0deg, #1d2c3a 0 8px, #203244 8px 16px); border-bottom: 6px solid #2478a8; }
  .testata .pagina { padding-top: 56px; padding-bottom: 40px; position: relative; }
  .testata .pagina > img { position: absolute; right: 16px; bottom: 0; height: 250px; image-rendering: pixelated; }
  .marchio { display: inline-flex; gap: 8px; align-items: center; color: var(--mare-chiaro); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; }
  .marchio i { width: 10px; height: 10px; background: var(--lanterna); box-shadow: 0 0 12px var(--lanterna); display: inline-block; }
  h1 { font-size: clamp(40px, 7vw, 76px); font-weight: 800; line-height: 0.95; margin: 14px 0 16px; }
  h1 span { color: var(--giallo); }
  .sotto { max-width: 620px; color: var(--piano); font-size: 17px; margin: 0; }
  .numeri { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 26px; }
  .numeri b { display: block; font: 800 30px 'Bricolage Grotesque', sans-serif; color: var(--testo); }
  .numeri span { color: var(--tenue); font-size: 13px; }
  .link { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  .link a { text-decoration: none; color: var(--testo); background: var(--carta2); border: 1px solid var(--riga); padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 14px; }
  .link a:hover { border-color: var(--mare); }

  section { margin-top: 44px; }
  .titolo-sez { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .titolo-sez h2 { font-size: 28px; font-weight: 800; }
  .titolo-sez span { color: var(--tenue); font-size: 14px; }

  /* quest */
  .quest { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .q { background: var(--carta); border: 1px solid var(--riga); border-left: 6px solid var(--giallo); border-radius: 8px; padding: 18px 18px 16px; text-decoration: none; color: inherit; display: block; }
  .q:hover { border-color: var(--giallo); }
  .q .etichetta { font-size: 12px; font-weight: 600; color: var(--fondo); background: var(--giallo); padding: 2px 8px; border-radius: 4px; }
  .q h3 { font-size: 21px; margin: 10px 0 6px; }
  .q p { margin: 0 0 10px; color: var(--piano); font-size: 14px; }
  .q small { color: var(--tenue); }

  /* personaggio */
  .pg + .pg { margin-top: 22px; }
  .pg.solo { grid-template-columns: 1fr; }
  .pg { background: var(--carta); border: 1px solid var(--riga); border-radius: 10px; display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }
  .palco { background: #20304a; position: relative; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .palco canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; background: #20304a; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 500 13px Inter, sans-serif; color: var(--testo); background: #2b3d5a; border: 1px solid #3b5274; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--mare); border-color: var(--mare); color: #10202a; }
  .chip.vista { padding: 4px 8px; font-size: 12px; min-width: 40px; }
  .chip.gira[aria-pressed="true"] { background: var(--giallo); border-color: var(--giallo); }
  .didascalia { font-size: 12px; color: #9fb3cc; min-height: 18px; }
  .info { padding: 22px 24px 24px; min-width: 0; }
  .info h3 { font-size: 26px; font-weight: 800; }
  .stato { display: inline-block; margin: 8px 0 12px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--carta2); border: 1px solid var(--riga); }
  .stato.approvato { background: var(--erba); color: #13200d; border: 0; }
  .stato.riferimento { background: var(--arancio); color: #2a1606; border: 0; }
  .nota { margin: 0 0 10px; }
  .descr { margin: 0 0 18px; color: var(--tenue); font-size: 13px; font-style: italic; }
  .etichetta-gruppo { font-size: 13px; font-weight: 600; color: var(--piano); margin: 18px 0 8px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .strip button { flex: 0 0 auto; padding: 0; border: 1px solid var(--riga); border-radius: 6px; background: var(--carta2); cursor: zoom-in; overflow: hidden; }
  .strip img { display: block; height: 120px; width: auto; }
  .griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-items: start; }
  .griglia button { padding: 0; border: 1px solid var(--riga); border-radius: 4px; background: #ff00ff; cursor: zoom-in; overflow: hidden; display: block; }
  .griglia img { width: 100%; height: auto; display: block; }
  .griglia figcaption { font-size: 11px; color: var(--tenue); padding: 3px 2px 0; overflow-wrap: anywhere; }
  .personaggi { display: grid; gap: 22px; }

  /* lightbox */
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
  dialog::backdrop { background: rgba(10, 8, 6, 0.88); }
  dialog img { max-width: 96vw; max-height: 88vh; display: block; border-radius: 6px; }
  dialog p { color: var(--piano); text-align: center; margin: 8px 0 0; font-size: 13px; }

  .filtri { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 0; margin-top: 36px; background: var(--fondo); border-bottom: 1px solid var(--riga); }
  .filtri .chip { background: var(--carta2); border-color: var(--riga); font-size: 14px; padding: 6px 14px; }
  .filtri .chip[aria-pressed="true"] { background: var(--giallo); border-color: var(--giallo); color: #2a1606; }
  .filtri .chip small { opacity: 0.7; margin-left: 4px; }
  .modelli { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .mod { background: var(--carta); border: 1px solid var(--riga); border-radius: 10px; overflow: hidden; }
  .mod .vetrina { position: relative; aspect-ratio: 1; background: radial-gradient(circle at 50% 70%, #3a4d66, #20304a 70%); }
  .mod model-viewer, .mod .vetrina > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mod .vetrina > img { object-fit: contain; padding: 18px; opacity: 0; transition: opacity 0.2s; pointer-events: none; image-rendering: auto; }
  .mod .vetrina.disegno > img { opacity: 1; }
  .mod .vetrina.disegno model-viewer { opacity: 0; }
  .mod .giro { position: absolute; left: 10px; bottom: 10px; z-index: 2; }
  .mod .testo { padding: 12px 14px 14px; }
  .mod h3 { font-size: 18px; }
  .mod p { margin: 4px 0 0; font-size: 13px; color: var(--tenue); }
  .disegni { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .disegni button { padding: 6px; border: 1px solid var(--riga); border-radius: 6px; background: #efe0c2; cursor: zoom-in; aspect-ratio: 1; }
  .disegni img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vuota { background: var(--carta); border: 1px dashed var(--riga); border-radius: 10px; padding: 18px; color: var(--tenue); }
  footer { margin-top: 56px; color: var(--tenue); font-size: 13px; }
  .vuoto { color: var(--tenue); }

  @media (max-width: 760px) {
    .pg { grid-template-columns: 1fr; }
    .testata .pagina { padding-top: 36px; } .testata .pagina > img { display: none; }
    .info { padding: 18px 16px 20px; }
    .strip img { height: 96px; }
  }
</style>
</head>
<body>
<header class="testata"><div class="pagina">
    <div class="marchio"><i></i>MAREA</div>
    <h1>L'Atelier<br><span>di MAREA</span></h1>
    <p class="sotto">Il posto dove nasce il mondo di MAREA: personaggi, modelli 3D, luoghi, effetti, riferimenti. Tutto quello che generiamo passa da qui, così ogni AI lavora nello stesso stile.</p>
    <div class="numeri" id="numeri"></div>
    <div class="link">
      <a href="https://github.com/worldwidejack/marea-atelier/blob/main/STILE.md">Lo stile</a>
      <a href="https://github.com/worldwidejack/marea-atelier/blob/main/CLAUDE.md">Le regole per gli AI</a>
      <a href="https://github.com/worldwidejack/marea-atelier">Il repo</a>
      <a href="https://worldwidejack.github.io/jack-tools/marea-armi/?look=sprite">La prova nel gioco</a>
    </div>
    <img id="eroe-testata" alt="" hidden>
  </div></header>
<div class="pagina">

  <section>
    <div class="titolo-sez"><h2>Quest</h2><span>i lavori aperti: prendine una</span></div>
    <div class="quest" id="quest"></div>
  </section>

  <nav class="filtri" id="filtri"></nav>
  <div id="stanze"></div>

  <footer id="piede"></footer>
</div>

<dialog id="lente"><img alt=""><p></p></dialog>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
const VISTE = ['S', 'SSE', 'SE', 'ESE', 'E', 'ENE', 'NE', 'NNE', 'N'];
// le 16 direzioni del gioco: le 9 disegnate e le 7 del lato sinistro, che sono lo specchio
const GIRO = [...VISTE.map((v) => [v, false]), ...VISTE.slice(1, 8).reverse().map((v) => [v, true])];
const NOMI_MOSSE = { cammina: 'cammina', camminata: 'camminata a 8 pose', corsa: 'corsa a 8 pose', scatto: 'scatto', bevi: 'pozione', salta: 'salto', leggera: 'arma leggera', pesante: 'arma pesante', onda: 'onda energetica' };
// disegni al secondo: 7 di serie (i cicli da 4); i cicli da 8 pose vanno più svelti, la corsa più della camminata
const FPS = { camminata: 10, corsa: 14 };
const NOMI_STATO ={ idea: 'idea', 'in lavorazione': 'in lavorazione', approvato: 'approvato', riferimento: 'riferimento' };
const REPO = 'https://github.com/worldwidejack/marea-atelier/blob/main/';

const cache = new Map();
function img(src) {
  if (!cache.has(src)) { const i = new Image(); i.src = src; cache.set(src, i); }
  return cache.get(src);
}
const el = (tag, attr = {}, ...figli) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attr)) k === 'class' ? (e.className = v) : k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const f of figli) if (f != null) e.append(f);
  return e;
};

const lente = document.getElementById('lente');
function apri(src, testo) { lente.querySelector('img').src = src; lente.querySelector('p').textContent = testo; lente.showModal(); }
lente.addEventListener('click', () => lente.close());

function palco(p) {
  const tutte = { ...p.mosse, ...p.armi };
  const ordine = Object.keys(NOMI_MOSSE);
  const nomi = Object.keys(tutte).sort((a, b) => (ordine.indexOf(a) + 1 || 99) - (ordine.indexOf(b) + 1 || 99));
  if (!nomi.length) return el('div', { class: 'palco' }, el('p', { class: 'didascalia' }, 'Ancora nessuno sprite.'));
  const tela = el('canvas', { width: 240, height: 240 });
  const g = tela.getContext('2d');
  const stato = { mossa: nomi.includes('cammina') ? 'cammina' : nomi[0], giro: 2, gira: true, t: 0 };
  const didascalia = el('div', { class: 'didascalia' });
  const chipsMosse = el('div', { class: 'chips' });
  const chipsViste = el('div', { class: 'chips' });
  const bottoneGira = el('button', { class: 'chip gira', 'aria-pressed': 'true' }, 'gira');
  bottoneGira.addEventListener('click', () => { stato.gira = !stato.gira; aggiornaChips(); });
  for (const m of nomi) chipsMosse.append(el('button', { class: 'chip', 'data-m': m, onclick: () => { stato.mossa = m; aggiornaChips(); } }, NOMI_MOSSE[m] ?? m));
  chipsViste.append(bottoneGira);
  for (const v of VISTE) chipsViste.append(el('button', { class: 'chip vista', 'data-v': v, onclick: () => { stato.gira = false; stato.giro = VISTE.indexOf(v); aggiornaChips(); } }, v));
  function aggiornaChips() {
    for (const b of chipsMosse.children) b.setAttribute('aria-pressed', b.dataset.m === stato.mossa);
    const [v] = GIRO[stato.giro];
    for (const b of chipsViste.querySelectorAll('.vista')) b.setAttribute('aria-pressed', !stato.gira && b.dataset.v === v);
    bottoneGira.setAttribute('aria-pressed', stato.gira);
  }
  aggiornaChips();
  // precarica
  for (const m of nomi) for (const ds of Object.values(tutte[m])) for (const d of ds) { img(d.src); if (d.sopra) img(d.sopra); }

  const SCALA = 4, TERRA = 214;
  function disegna(ora) {
    const dt = Math.min(0.1, (ora - (stato.ultimo ?? ora)) / 1000); stato.ultimo = ora; stato.t += dt;
    if (stato.gira) stato.giro = Math.floor(stato.t / 0.45) % GIRO.length;
    const [vista, specchio] = GIRO[stato.giro];
    const disegni = tutte[stato.mossa][vista] ?? [];
    const d = disegni[Math.floor(stato.t * (FPS[stato.mossa] ?? 7)) % Math.max(1, disegni.length)];
    // sfondo: un pezzo di molo
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#20304a'; g.fillRect(0, 0, 240, 240);
    for (let y = 0; y < 240; y += 12) { g.fillStyle = y % 24 ? '#22344f' : '#20304a'; g.fillRect(0, y, 240, 6); }
    g.fillStyle = '#8e5a2b'; g.fillRect(0, TERRA - 4, 240, 30);
    g.fillStyle = '#c98a4b'; for (let x = 0; x < 240; x += 40) g.fillRect(x, TERRA - 4, 38, 26);
    g.fillStyle = '#5a3a1e'; g.fillRect(0, TERRA + 22, 240, 4);
    g.fillStyle = 'rgba(35,32,31,0.35)'; g.beginPath(); g.ellipse(120, TERRA + 2, 26, 6, 0, 0, 7); g.fill();
    if (d) {
      const i = img(d.src);
      if (i.complete && i.naturalWidth) {
        const ax = d.ax ?? i.naturalWidth / 2, ay = d.ay ?? i.naturalHeight - 1;
        g.save();
        g.translate(120, TERRA + 2);
        if (specchio) g.scale(-1, 1);
        g.scale(SCALA, SCALA);
        g.drawImage(i, -ax, -ay);
        // dove andrà l'arma: un bastone d'acciaio dal pugno, poi la mano sopra
        if (d.presa && d.lungo) {
          const x0 = d.presa[0] - ax, y0 = d.presa[1] - ay;
          const x1 = x0 + Math.cos(d.ang) * d.lungo, y1 = y0 + Math.sin(d.ang) * d.lungo;
          g.lineCap = 'round';
          g.strokeStyle = '#23201f'; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
          g.strokeStyle = '#e8e1d6'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
          const s = d.sopra && img(d.sopra);
          if (s && s.complete && s.naturalWidth) g.drawImage(s, -ax, -ay);
        }
        g.restore();
      }
    }
    didascalia.textContent = `${NOMI_MOSSE[stato.mossa] ?? stato.mossa} · vista ${vista}${specchio ? ' (specchio)' : ''}${d && d.presa ? ' · il bastone grigio è dove il gioco mette l\'arma' : ''}`;
    requestAnimationFrame(disegna);
  }
  requestAnimationFrame(disegna);
  return el('div', { class: 'palco' }, tela, chipsMosse, chipsViste, didascalia);
}

const nome = (src) => src.split('/').pop();
const contaSprite = (p) => [...Object.values(p.mosse), ...Object.values(p.armi)].reduce((a, m) => a + Object.values(m).reduce((b, d) => b + d.length, 0), 0);

function info(p) {
  const nDisegni = contaSprite(p);
  const box = el('div', { class: 'info' },
    el('h3', {}, p.nome),
    el('span', { class: `stato ${p.stato}` }, NOMI_STATO[p.stato] ?? p.stato),
    p.nota ? el('p', { class: 'nota' }, p.nota) : null,
    p.descrizione ? el('p', { class: 'descr' }, p.descrizione) : null,
  );
  if (p.design.length) {
    box.append(el('div', { class: 'etichetta-gruppo' }, p.categoria === 'personaggi' ? 'Disegno e viste' : 'Fogli e confronti'));
    const s = el('div', { class: 'strip' });
    for (const src of p.design) s.append(el('button', { onclick: () => apri(src, nome(src)) }, el('img', { src, alt: nome(src), loading: 'lazy' })));
    box.append(s);
  }
  if (p.disegni.length) {
    box.append(el('div', { class: 'etichetta-gruppo' }, `I disegni · ${p.disegni.length}`));
    const gr = el('div', { class: 'disegni' });
    for (const src of p.disegni) gr.append(el('button', { title: nome(src), onclick: () => apri(src, nome(src)) }, el('img', { src, alt: nome(src), loading: 'lazy' })));
    box.append(gr);
  }
  if (p.fogli.length) {
    box.append(el('div', { class: 'etichetta-gruppo' }, `Fogli generati · ${p.fogli.length}${nDisegni ? `, da cui escono ${nDisegni} sprite` : ''}`));
    const gr = el('div', { class: 'griglia' });
    for (const src of p.fogli) gr.append(el('figure', { style: 'margin:0' }, el('button', { onclick: () => apri(src, nome(src)) }, el('img', { src, alt: nome(src), loading: 'lazy' })), el('figcaption', {}, nome(src).replace(/\.\w+$/, ''))));
    box.append(gr);
  }
  const link = el('div', { class: 'etichetta-gruppo' }, el('a', { href: `${REPO}${p.categoria}/${p.id}/scheda.json` }, 'la scheda'));
  if (p.link) link.append(' · ', el('a', { href: p.link }, 'provalo'));
  box.append(link);
  return box;
}

function modello(p) {
  const vetrina = el('div', { class: 'vetrina' });
  const mv = el('model-viewer', { src: p.modelli[0], alt: p.nome, 'auto-rotate': '', 'camera-controls': '', 'rotation-per-second': '24deg', 'interaction-prompt': 'none', 'shadow-intensity': '0.6', exposure: '1.05', 'camera-orbit': '30deg 72deg auto', loading: 'lazy' });
  vetrina.append(mv);
  const dis = p.copertina[0];
  if (dis) {
    vetrina.append(el('img', { src: dis, alt: `disegno di ${p.nome}`, loading: 'lazy' }));
    const b = el('button', { class: 'chip giro', 'aria-pressed': 'false' }, 'disegno');
    b.addEventListener('click', () => { const on = vetrina.classList.toggle('disegno'); b.setAttribute('aria-pressed', on); });
    vetrina.append(b);
  }
  return el('article', { class: 'mod' }, vetrina, el('div', { class: 'testo' },
    el('h3', {}, p.nome),
    el('span', { class: `stato ${p.stato}` }, NOMI_STATO[p.stato] ?? p.stato),
    el('p', {}, [p.generatore && `fatto con ${p.generatore}`, p.alto && `alto ${String(p.alto).replace('.', ',')} m`].filter(Boolean).join(' · ')),
    el('p', {}, el('a', { href: `${REPO}${p.categoria}/${p.id}/scheda.json` }, 'la scheda'))));
}

const STANZE = {
  personaggi: ['Personaggi', 'tocca una mossa o una vista; «gira» li fa ruotare in 16 direzioni'],
  modelli: ['Modelli 3D', 'girali col dito; «disegno» mostra da cosa sono nati'],
  luoghi: ['Luoghi', 'isole, zone, posti: il kit dei disegni e com\'è venuto'],
  effetti: ['Effetti', 'onde, fulmini, evocazioni, polvere'],
  riferimenti: ['Riferimenti', 'cose di altri che ci piacciono: si studiano, non sono canone'],
};

fetch('galleria.json', { cache: 'no-store' }).then((r) => r.json()).then((dati) => {
  const tutti = Object.values(dati.categorie).flat();
  const aperte = dati.quest.filter((q) => q.stato !== 'chiusa');
  const sprite = tutti.reduce((a, p) => a + contaSprite(p), 0);
  const numeri = document.getElementById('numeri');
  for (const [n, t] of [[tutti.length, 'pezzi del mondo'], [sprite, 'sprite'], [dati.categorie.modelli?.length ?? 0, 'modelli 3D'], [aperte.length, aperte.length === 1 ? 'quest aperta' : 'quest aperte']])
    numeri.append(el('div', {}, el('b', {}, String(n)), el('span', {}, t)));
  const quest = document.getElementById('quest');
  if (!dati.quest.length) quest.append(el('p', { class: 'vuoto' }, 'Nessuna quest aperta.'));
  dati.quest.forEach((q, i) => quest.append(el('a', { class: 'q', href: REPO + q.file },
    el('span', { class: 'etichetta' }, `quest ${i + 1} · ${q.stato}`), el('h3', {}, q.titolo), el('p', {}, q.testo), el('small', {}, q.chi ? `chi: ${q.chi}` : 'libera'))));
  const primo = (dati.categorie.personaggi ?? []).find((p) => p.mosse.cammina?.SE);
  if (primo) { const t = document.getElementById('eroe-testata'); t.src = primo.mosse.cammina.SE[1].src; t.hidden = false; }

  const stanze = document.getElementById('stanze'), filtri = document.getElementById('filtri');
  const sezioni = {};
  for (const [cat, voci] of Object.entries(dati.categorie)) {
    const [titolo, aiuto] = STANZE[cat] ?? [cat, ''];
    const corpo = cat === 'modelli' ? el('div', { class: 'modelli' }) : el('div');
    if (!voci.length) corpo.append(el('p', { class: 'vuota' }, `Ancora niente. Si comincia da una cartella in ${cat}/ con la sua scheda.json.`));
    for (const p of voci) {
      if (cat === 'modelli' && p.modelli.length) corpo.append(modello(p));
      else if (Object.keys(p.mosse).length || Object.keys(p.armi).length) corpo.append(el('article', { class: 'pg' }, palco(p), info(p)));
      else corpo.append(el('article', { class: 'pg solo' }, info(p)));
    }
    sezioni[cat] = el('section', { id: cat }, el('div', { class: 'titolo-sez' }, el('h2', {}, titolo), el('span', {}, aiuto)), corpo);
    stanze.append(sezioni[cat]);
  }
  const chips = [['tutto', 'tutto', tutti.length], ...Object.entries(dati.categorie).map(([c, v]) => [c, STANZE[c]?.[0] ?? c, v.length])];
  for (const [c, t, n] of chips) {
    const b = el('button', { class: 'chip', 'aria-pressed': c === 'tutto' ? 'true' : 'false' }, t, el('small', {}, String(n)));
    b.addEventListener('click', () => {
      for (const x of filtri.children) x.setAttribute('aria-pressed', x === b);
      for (const [k, sez] of Object.entries(sezioni)) sez.hidden = c !== 'tutto' && k !== c;
    });
    filtri.append(b);
  }
  document.getElementById('piede').textContent = `Aggiornata il ${new Date(dati.aggiornato).toLocaleString('it-IT', { dateStyle: 'long', timeStyle: 'short' })} · si rifà da sola a ogni push su main.`;
}).catch((e) => { console.error(e); document.getElementById('stanze').append(el('p', { class: 'vuoto' }, 'Manca galleria.json: lancia python3 strumenti/galleria.py')); });
</script>
</body>
